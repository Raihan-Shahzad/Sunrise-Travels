kind = "mobile"
previewPath = "/sunrise-travels-mobile/"
title = "Sunrise Travels Mobile"
version = "1.0.0"
id = "artifacts/sunrise-travels-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/sunrise-travels-mobile/" ]
localPort = 22826

[services.development]
run = "pnpm --filter @workspace/sunrise-travels-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sunrise-travels-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sunrise-travels-mobile", "run", "serve" ]

[services.env]
PORT = "22826"
BASE_PATH = "/sunrise-travels-mobile/"
